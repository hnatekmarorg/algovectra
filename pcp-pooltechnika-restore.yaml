apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcp-restore-key
  namespace: pcp-pooltechnika-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-algovectra
    kind: ClusterSecretStore
  target:
    name: pcp-restore-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: pcp-pooltechnika-prod/pooltechnika-restore-20261117-07deef14
        property: key
    - secretKey: sha256
      remoteRef:
        key: pcp-pooltechnika-prod/pooltechnika-restore-20261117-07deef14
        property: sha256
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pcp-restore-postgres
  namespace: pcp-pooltechnika-prod
spec:
  podSelector:
    matchLabels:
      app: pcp-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pcp-restore
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcp-restore-scripts
  namespace: pcp-pooltechnika-prod
data:
  decrypt.mjs: |
    import { createDecipheriv, createHash } from 'node:crypto';
    import { createReadStream, createWriteStream } from 'node:fs';
    import { open, rename, rm } from 'node:fs/promises';
    import { Transform } from 'node:stream';
    import { pipeline } from 'node:stream/promises';

    const source = '/bundle/pooltechnika.tar.gcm';
    const output = '/bundle/restore.tar.partial';
    const key = process.env.PCP_RESTORE_KEY;
    const expected = process.env.PCP_RESTORE_SHA256;
    if (!/^[a-f0-9]{64}$/.test(key ?? '') || !/^[a-f0-9]{64}$/.test(expected ?? '')) {
      throw Error('Restore key or archive checksum is absent');
    }

    const hash = createHash('sha256');
    for await (const bytes of createReadStream(source)) hash.update(bytes);
    if (hash.digest('hex') !== expected) throw Error('Encrypted archive checksum mismatch');

    const input = await open(source, 'r');
    const { size } = await input.stat();
    const nonce = Buffer.alloc(12);
    const tag = Buffer.alloc(16);
    try {
      if (size <= nonce.length + tag.length) throw Error('Encrypted archive is empty');
      await input.read(nonce, 0, nonce.length, 0);
      await input.read(tag, 0, tag.length, size - tag.length);
    } finally {
      await input.close();
    }

    const decrypt = createDecipheriv('aes-256-gcm', Buffer.from(key, 'hex'), nonce);
    decrypt.setAAD(Buffer.from('pcp-pooltechnika-prod/bundle-v1'));
    decrypt.setAuthTag(tag);
    try {
      await pipeline(
        createReadStream(source, { start: nonce.length, end: size - tag.length - 1 }),
        new Transform({ transform(bytes, _encoding, done) { done(null, decrypt.update(bytes)); }, flush(done) {
          try { done(null, decrypt.final()); } catch (error) { done(error); }
        } }),
        createWriteStream(output, { flags: 'wx', mode: 0o600 }),
      );
      await rename(output, '/bundle/restore.tar');
    } catch (error) {
      await rm(output, { force: true });
      throw error;
    }
    console.log('Encrypted archive digest and authentication succeeded');
  restore.sh: |
    set -eu
    umask 077
    cd /bundle
    test "$(tar -tf restore.tar | LC_ALL=C sort)" = "$(printf '%s\n' SHA256SUMS database.dump site-assets.tar)"
    tar -xf restore.tar
    sha256sum -c SHA256SUMS

    test -z "$(find /site-assets -mindepth 1 -maxdepth 1 -print -quit)"
    before=$(psql -XAtq -v ON_ERROR_STOP=1 -c "select count(*) from pg_tables where schemaname = 'public'")
    test "$before" = 0
    staged=$(mktemp -d /site-assets/.pcp-restore.XXXXXXXX)
    trap 'test -d "$staged" && rm -rf -- "$staged" || true' EXIT
    tar -xpf site-assets.tar -C "$staged"
    files=$(find "$staged" -type f | wc -l | tr -d ' ')
    test "$files" = 796

    pg_restore --single-transaction --exit-on-error --no-owner --no-privileges --dbname="$PGDATABASE" database.dump
    observed=$(psql -XAtq -F '|' -v ON_ERROR_STOP=1 -c "
      select
        (select count(*) from tenants),
        (select count(*) from tenants where slug = 'pooltechnika'),
        (select count(*) from inquiries),
        (select count(*) from products where tenant_id = (select id from tenants where slug = 'pooltechnika')),
        (select count(*) from product_version_assets where tenant_id = (select id from tenants where slug = 'pooltechnika'));")
    test "$observed" = '1|1|3|2|460'
    find "$staged" -mindepth 1 -maxdepth 1 -exec mv -- '{}' /site-assets/ ';'
    rmdir "$staged"
    test "$(find /site-assets -type f | wc -l | tr -d ' ')" = "$files"
    printf 'Pooltechnika restore verified with two products, 460 asset references, and %s Site files\n' "$files"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pcp-restore-07deef14
  namespace: pcp-pooltechnika-prod
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pcp-restore
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download
          image: ghcr.io/oras-project/oras@sha256:98cb05d48988f3fe4b8a8eedb324a9f7644d4be88470769eeaeab433b12e37dd
          args:
            - pull
            - --registry-config
            - /registry/.dockerconfigjson
            - --output
            - /bundle
            - 'ghcr.io/algovectra/pcp-api@sha256:641b16fcb23c0748a4cfc01ee39e0ec84664a298644328c9cd3a263d2f79d01e'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: registry, mountPath: /registry, readOnly: true}
            - {name: bundle, mountPath: /bundle}
        - name: decrypt
          image: docker.io/library/node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c
          command: [node, /restore/decrypt.mjs]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: PCP_RESTORE_KEY
              valueFrom:
                secretKeyRef: {name: pcp-restore-key, key: key}
            - name: PCP_RESTORE_SHA256
              valueFrom:
                secretKeyRef: {name: pcp-restore-key, key: sha256}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /restore, readOnly: true}
            - {name: bundle, mountPath: /bundle}
      containers:
        - name: restore
          image: docker.io/library/postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          command: ["/bin/sh", /restore/restore.sh]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - {name: PGHOST, value: pcp-db}
            - {name: PGUSER, value: pcp}
            - {name: PGDATABASE, value: pcp}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: pcp-database, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /restore, readOnly: true}
            - {name: bundle, mountPath: /bundle}
            - {name: site-assets, mountPath: /site-assets}
      volumes:
        - name: registry
          secret:
            secretName: pcp-registry
        - name: scripts
          configMap:
            name: pcp-restore-scripts
        - name: bundle
          emptyDir:
            sizeLimit: 2Gi
        - name: site-assets
          persistentVolumeClaim:
            claimName: site-assets
