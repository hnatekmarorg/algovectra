apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pcp-web-tls-managed
  namespace: pcp-pooltechnika-prod
spec:
  secretName: pcp-web-tls-managed
  dnsNames:
    - pcp.algovectra.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
