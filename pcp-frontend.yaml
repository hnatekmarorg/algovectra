apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcp-web-tls-bootstrap
  namespace: pcp-pooltechnika-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-algovectra
    kind: ClusterSecretStore
  target:
    name: pcp-web-tls-bootstrap
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ .certificate }}'
        tls.key: '{{ .privateKey }}'
  data:
    - secretKey: certificate
      remoteRef:
        key: pcp-pooltechnika-prod/frontend-tls-bootstrap
        property: tls.crt
    - secretKey: privateKey
      remoteRef:
        key: pcp-pooltechnika-prod/frontend-tls-bootstrap
        property: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: pcp-web
  namespace: pcp-pooltechnika-prod
spec:
  selector: {app: pcp-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcp-web
  namespace: pcp-pooltechnika-prod
  annotations:
    konghq.com/https-redirect-status-code: "308"
    konghq.com/preserve-host: "true"
    konghq.com/protocols: https
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  tls:
    - hosts: [pcp.algovectra.com]
      secretName: pcp-web-tls-managed
  rules:
    - host: pcp.algovectra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pcp-web
                port: {name: http}
