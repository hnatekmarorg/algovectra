apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-backend-new
  namespace: default
  labels:
    app: pizza-backend-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pizza-backend-new
  template:
    metadata:
      name: pizza-backend-new
      labels:
        app: pizza-backend-new
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: pizza-backend-new
          image: algovectra/runpod-inference:be-v0.0.280
          imagePullPolicy: IfNotPresent
          env:
            - name: thingsboard_url
              value: "https://thingsboard.hnatekmar.xyz/"
            - name: crust_infer_server
              value: "http://router.fission.svc.cluster.local/pizza-infer-s3"
            - name: components_infer_server
              value: "http://router.fission.svc.cluster.local/components-detector"
          envFrom:
            - secretRef:
                name: config
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # All probes hit /health: no auth, no I/O, answered by the event loop itself,
          # so it fails only when the process cannot serve at all (2026-10-20: a deadlocked
          # event loop kept accepting connections for 2.5 h). Observed loop lag under load
          # peaks at ~1.5 s; the timeouts below leave room for that.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30   # up to 300 s to start (BB menu sync, pod pool + CNN warmups)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3    # container restarted after ~30 s of no answer
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: pizza-backend-new
  namespace: default
spec:
  selector:
    app: pizza-backend-new
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pizza-backend-new
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - pizza-checker-api.algovectra.com
      secretName: pizza-backend-tls-secret
  rules:
    - host: pizza-checker-api.algovectra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pizza-backend-new
                port:
                  number: 3000
