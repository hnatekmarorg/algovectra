  "items": [
    {
      "apiVersion": "external-secrets.io/v1",
      "kind": "ExternalSecret",
      "metadata": {
        "name": "pcp-database",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "refreshInterval": "1h",
        "secretStoreRef": {
          "name": "local-algovectra",
          "kind": "ClusterSecretStore"
        },
        "target": {
          "name": "pcp-database",
          "creationPolicy": "Owner",
          "template": {
            "type": "Opaque"
          }
        },
        "data": [
          {
            "secretKey": "POSTGRES_PASSWORD",
            "remoteRef": {
              "key": "pcp/database",
              "property": "POSTGRES_PASSWORD"
            }
          }
        ]
      }
    },
    {
      "apiVersion": "external-secrets.io/v1",
      "kind": "ExternalSecret",
      "metadata": {
        "name": "pcp-api",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "refreshInterval": "1h",
        "secretStoreRef": {
          "name": "local-algovectra",
          "kind": "ClusterSecretStore"
        },
        "target": {
          "name": "pcp-api",
          "creationPolicy": "Owner",
          "template": {
            "type": "Opaque"
          }
        },
        "data": [
          {
            "secretKey": "DATABASE_URL",
            "remoteRef": {
              "key": "pcp/api",
              "property": "DATABASE_URL"
            }
          },
          {
            "secretKey": "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON",
            "remoteRef": {
              "key": "pcp/api",
              "property": "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"
            }
          },
          {
            "secretKey": "ADMIN_ALLOWLIST_EMAILS",
            "remoteRef": {
              "key": "pcp/api",
              "property": "ADMIN_ALLOWLIST_EMAILS"
            }
          }
        ]
      }
    },
    {
      "apiVersion": "external-secrets.io/v1",
      "kind": "ExternalSecret",
      "metadata": {
        "name": "regcred",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "refreshInterval": "1h",
        "secretStoreRef": {
          "name": "local-algovectra",
