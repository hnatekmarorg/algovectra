    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "pcp-db",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "clusterIP": "None",
        "selector": {
          "app": "pcp-db"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "pcp-db",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "serviceName": "pcp-db",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "pcp-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "pcp-db"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "postgres",
                "image": "docker.io/library/postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb",
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "pcp"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "value": "pcp"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-database",
                        "key": "POSTGRES_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "256Mi"
                  },
                  "limits": {
                    "memory": "1Gi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "pcp",
                      "-d",
                      "pcp"
                    ]
                  },
                  "periodSeconds": 5
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ]
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "storageClassName": "local-path",
              "resources": {
                "requests": {
                  "storage": "20Gi"
                }
              }
            }
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "pcp-api",
        "namespace": "default",
        "labels": {
          "app.kubernetes.io/part-of": "pcp"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "pcp-api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "pcp-api"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "imagePullSecrets": [
              {
                "name": "regcred"
              }
            ],
            "containers": [
              {
                "name": "api",
                "image": "ghcr.io/algovectra/pcp-api@sha256:8e5b7ee26b8dd54e201ebeeae34d06c37ce722b3e867df0337cb556441ce6d24",
                "ports": [
                  {
                    "containerPort": 3000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "256Mi"
                  },
                  "limits": {
                    "memory": "1Gi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/ready",
                    "port": 3000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 3000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3
                },
                "env": [
                  {
                    "name": "NODE_ENV",
                    "value": "production"
                  },
                  {
                    "name": "CORS_ORIGINS",
                    "value": "https://draftigo.com,https://cms.draftigo.com,https://app.draftigo.com,https://garden.draftigo.com,https://sauna.draftigo.com,https://pool.draftigo.com,https://spa.draftigo.com,https://fence.draftigo.com"
                  },
                  {
                    "name": "PORT",
                    "value": "3000"
                  },
                  {
                    "name": "PUBLIC_CONFIGURATOR_URL",
                    "value": "https://app.draftigo.com"
                  },
                  {
                    "name": "TENANT_REPOS_DIR",
                    "value": "/var/data/tenants"
                  },
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-api",
                        "key": "DATABASE_URL"
                      }
                    }
                  },
                  {
                    "name": "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-api",
                        "key": "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"
                      }
                    }
                  },
                  {
                    "name": "ADMIN_ALLOWLIST_EMAILS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-api",
                        "key": "ADMIN_ALLOWLIST_EMAILS"
                      }
                    }
                  },
                  {
                    "name": "GROQ_API_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-api",
                        "key": "GROQ_API_KEY",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "SEARCH_API_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "pcp-api",
                        "key": "SEARCH_API_KEY",
                        "optional": true
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "tenant-repos",
                    "mountPath": "/var/data/tenants"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 3000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3,
                  "failureThreshold": 60
                }
              }
            ],
            "volumes": [
              {
                "name": "tenant-repos",
                "persistentVolumeClaim": {
                  "claimName": "pcp-tenant-repos"
                }
              }
            ]
          }
        }
      }
    },
