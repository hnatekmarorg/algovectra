# PCP staging on the existing Algovectra Argo CD application.
apiVersion: v1
kind: Namespace
metadata:
  name: pcp-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=confirm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcp-database
  namespace: pcp-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-algovectra
  target:
    name: pcp-database
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pcp-staging/database
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcp-api
  namespace: pcp-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-algovectra
  target:
    name: pcp-api
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pcp-staging/api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pcp-registry
  namespace: pcp-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-algovectra
  target:
    name: pcp-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: pcp-staging/registry
        property: .dockerconfigjson
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pcp-tenant-repos
  namespace: pcp-staging
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pcp-db
  namespace: pcp-staging
spec:
  clusterIP: None
  selector:
    app: pcp-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pcp-db
  namespace: pcp-staging
spec:
  serviceName: pcp-db
  replicas: 1
  selector:
    matchLabels:
      app: pcp-db
  template:
    metadata:
      labels:
        app: pcp-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pcp
            - name: POSTGRES_USER
              value: pcp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pcp-database
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, pcp, -d, pcp]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pcp-db
  namespace: pcp-staging
spec:
  podSelector:
    matchLabels:
      app: pcp-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pcp-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: pcp-api
  namespace: pcp-staging
spec:
  selector:
    app: pcp-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pcp-web
  namespace: pcp-staging
spec:
  selector:
    app: pcp-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcp-api
  namespace: pcp-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts: [pcp-staging.algovectra.com]
      secretName: pcp-staging-tls
  rules:
    - host: pcp-staging.algovectra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pcp-web
                port:
                  name: http
